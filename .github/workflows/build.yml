name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ScanLab.xcodeproj \
            -scheme ScanLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          ls -la build/Build/Products/Release-iphoneos/

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "No .app produced"; exit 1; fi
          echo "APP=$APP"
          rm -rf Payload ScanLab-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ScanLab-unsigned.ipa Payload
          ls -lh ScanLab-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ScanLab-unsigned-ipa
          path: ScanLab-unsigned.ipa
          retention-days: 30
