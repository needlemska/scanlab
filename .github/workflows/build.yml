name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ScanLab.xcodeproj \
            -scheme ScanLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          ls -la build/Build/Products/Release-iphoneos/

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "No .app produced"; exit 1; fi
          echo "APP=$APP"
          rm -rf Payload ScanLab-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ScanLab-unsigned.ipa Payload
          ls -lh ScanLab-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ScanLab-unsigned-ipa
          path: ScanLab-unsigned.ipa
          retention-days: 30

      # На части сетей (в т.ч. у владельца проекта) хосты
      # pipelines/objects.githubusercontent.com недоступны, поэтому артефакт
      # с GitHub скачать нельзя. Дублируем IPA в ветку builds — git ходит
      # через github.com:443, который доступен.
      - name: Publish IPA to "builds" branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "ScanLab CI"
          git config user.email "ci@scanlab.local"
          printf 'run=%s\ncommit=%s\nbuilt=%s\n' "${{ github.run_number }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" > BUILD.txt
          shasum -a 256 ScanLab-unsigned.ipa | awk '{print $1}' > ScanLab-unsigned.ipa.sha256
          git checkout -B builds
          git add -f BUILD.txt ScanLab-unsigned.ipa ScanLab-unsigned.ipa.sha256
          git commit -m "build #${{ github.run_number }} (${{ github.sha }})"
          git push -f origin builds
